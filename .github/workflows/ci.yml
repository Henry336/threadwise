name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: threadwise
          POSTGRES_PASSWORD: threadwise
          POSTGRES_DB: threadwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threadwise -d threadwise_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://threadwise:threadwise@localhost:5432/threadwise_test
      TELEGRAM_BOT_TOKEN: test-token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scan tracked files for credential signatures
        run: npm run security:scan-secrets
      - name: Audit production dependencies
        run: npm run security:audit
      - name: Audit the complete dependency graph
        run: npm run security:audit:all
      - run: npm run db:generate
      - name: Apply all migrations to the isolated synthetic database
        run: npm run db:migrate
      - name: Run the bounded adversarial assurance matrix
        run: npm run security:assurance
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx prisma validate
