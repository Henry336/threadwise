services:
  - type: web
    name: threadwise
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CONNECTION_LIMIT
        value: "3"
      - key: DATABASE_POOL_TIMEOUT_SECONDS
        value: "30"
      - key: SUPABASE_RUNTIME_POOL_MODE
        value: auto
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_MODEL_FALLBACKS
        value: gpt-5.5,gpt-5.4,gpt-5.4-nano
      - key: STUDY_ANALYSIS_POLL_MS
        value: "10000"
      - key: STUDY_ANALYSIS_TIMEOUT_MS
        value: "90000"
      - key: STUDY_ANALYSIS_LEASE_SECONDS
        value: "180"
      - key: STUDY_ANALYSIS_MAX_OUTPUT_TOKENS
        value: "8192"
      - key: ADMIN_STATUS_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET_PATH
        value: /telegram/threadwise-v2
      - key: WEBHOOK_SECRET_TOKEN
        sync: false
      - key: BEACON_BOT_TOKEN
        sync: false
      - key: BEACON_OWNER_TELEGRAM_ID
        sync: false
      - key: BEACON_TEST_CHAT_ID
        sync: false
      - key: BEACON_PRODUCTION_CHAT_ID
        sync: false
      - key: BEACON_MODERATOR_CHAT_ID
        sync: false
      - key: BEACON_WEBHOOK_SECRET_PATH
        value: /telegram/beacon-webhook
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALENDAR_REDIRECT_URI
        sync: false
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_REDIRECT_URI
        sync: false
      - key: MICROSOFT_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: DEFAULT_TIMEZONE
        value: Asia/Singapore
      - key: DEFAULT_REMINDER_INTERVAL_MINUTES
        value: "180"
      - key: BOT_ALLOWED_TELEGRAM_IDS
        sync: false
      - key: STUDY_OWNER_TELEGRAM_ID
        sync: false
      - key: STUDY_ALLOWED_CHAT_ID
        sync: false
      - key: CANVAS_ACCESS_TOKEN
        sync: false
      - key: CANVAS_BASE_URL
        value: https://canvas.nus.edu.sg/api/v1
      - key: STUDY_CANVAS_SYNC_INTERVAL_MINUTES
        value: "30"
      - key: STUDY_TRANSIT_BASE_URL
        value: https://improved-nextbus.vercel.app
      - key: STUDY_EXTERNAL_REQUEST_TIMEOUT_MS
        value: "12000"
      - key: CODEX_OWNER_TELEGRAM_ID
        sync: false
      - key: CODEX_TELEGRAM_CHAT_ID
        sync: false
      - key: CODEX_WORKER_TOKEN
        sync: false
      - key: CODEX_JOB_LEASE_SECONDS
        value: "3600"
      - key: FILE_COURIER_MAX_BYTES
        value: "50000000"
